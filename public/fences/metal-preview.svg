  <polygon points="66,60 70,48 74,60" fill="#3d3d3d"/>
  <polygon points="96,60 100,48 104,60" fill="#3d3d3d"/>
  <polygon points="126,60 130,48 134,60" fill="#3d3d3d"/>
  <polygon points="156,60 160,48 164,60" fill="#3d3d3d"/>
  <polygon points="186,60 190,48 194,60" fill="#3d3d3d"/>
  <polygon points="216,60 220,48 224,60" fill="#3d3d3d"/>
  <polygon points="246,60 250,48 254,60" fill="#3d3d3d"/>
  <polygon points="276,60 280,48 284,60" fill="#3d3d3d"/>
  <polygon points="306,60 310,48 314,60" fill="#3d3d3d"/>
  <polygon points="336,60 340,48 344,60" fill="#3d3d3d"/>
