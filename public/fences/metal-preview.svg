  <!-- Horizontal rails -->
  <line x1="20" y1="80" x2="380" y2="80" stroke="#2D2D2D" stroke-width="3"/>
  <line x1="20" y1="220" x2="380" y2="220" stroke="#2D2D2D" stroke-width="3"/>
  <text x="200" y="280" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="18" font-weight="600">Metalna ograda</text>
