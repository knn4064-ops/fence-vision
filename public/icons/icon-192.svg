<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#1e40af"/>
  <g transform="translate(32, 40)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fence posts -->
    <line x1="10" y1="20" x2="10" y2="110"/>
    <line x1="64" y1="10" x2="64" y2="110"/>
    <line x1="118" y1="20" x2="118" y2="110"/>
    <!-- Horizontal rails -->
    <line x1="10" y1="35" x2="118" y2="35"/>
    <line x1="10" y1="65" x2="118" y2="65"/>
    <line x1="10" y1="95" x2="118" y2="95"/>
    <!-- Post caps -->
    <rect x="4" y="14" width="12" height="8" rx="2" fill="#ffffff"/>
    <rect x="58" y="4" width="12" height="8" rx="2" fill="#ffffff"/>
    <rect x="112" y="14" width="12" height="8" rx="2" fill="#ffffff"/>
    <!-- Ground -->
    <line x1="0" y1="110" x2="128" y2="110" stroke-width="3"/>
  </g>
  <text x="96" y="170" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700">FV</text>
</svg>
