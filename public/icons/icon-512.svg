<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1e40af"/>
  <g transform="translate(80, 100)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fence posts -->
    <line x1="25" y1="50" x2="25" y2="280"/>
    <line x1="176" y1="30" x2="176" y2="280"/>
    <line x1="327" y1="50" x2="327" y2="280"/>
    <!-- Horizontal rails -->
    <line x1="25" y1="90" x2="327" y2="90"/>
    <line x1="25" y1="170" x2="327" y2="170"/>
    <line x1="25" y1="250" x2="327" y2="250"/>
    <!-- Post caps -->
    <rect x="10" y="35" width="30" height="18" rx="4" fill="#ffffff"/>
    <rect x="161" y="15" width="30" height="18" rx="4" fill="#ffffff"/>
    <rect x="312" y="35" width="30" height="18" rx="4" fill="#ffffff"/>
    <!-- Ground -->
    <line x1="0" y1="280" x2="352" y2="280" stroke-width="8"/>
  </g>
  <text x="256" y="440" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="48" font-weight="700">FenceVision</text>
</svg>
